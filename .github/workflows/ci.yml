name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend (SQLite) - type check + tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check (strict)
        run: python -m mypy app --strict
      - name: Tests + coverage
        run: python -m pytest -q

  backend-postgres:
    name: Backend (live Postgres) - R1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_fastapi
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: pharmacy
          POSTGRES_DB: pharmacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PHARMACY_DB_URL: postgresql+asyncpg://pharmacy:pharmacy@localhost:5432/pharmacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live Postgres verification
        run: python -m pytest tests/test_postgres_live.py -q

  frontend:
    name: Frontend - tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx next build

  contract-check:
    name: Frontend/Backend contract parity (C3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check contract parity
        run: npm run check:contracts

  docker-build:
    name: Docker images (R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend_fastapi/Dockerfile -t pharmacy-backend ./backend_fastapi
      - name: Build frontend image
        run: docker build -t pharmacy-frontend .

  e2e:
    name: Playwright E2E (R3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npx next build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test

  dependency-scan:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7"
          pip install -e ".[dev]"
      - name: Audit dependencies
        run: pip-audit --ignore-vuln PYSEC-2026-1845

  stack-smoke:
    name: Stack smoke test (compose + nginx)
    runs-on: ubuntu-latest
    needs: [docker-build]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Wait for nginx edge
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ && curl -sf http://localhost:8080/api/v1/health; then
              echo "stack healthy"; exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy"; docker compose logs; exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
