name: Release (Windows)

# Automated signed Windows build. Produces the MSI + NSIS installers and attaches
# them to a GitHub Release when a version tag is pushed.
#
# Required repository secrets:
#   WINDOWS_CERTIFICATE          - base64-encoded Authenticode .pfx certificate
#   WINDOWS_CERTIFICATE_PASSWORD - password for that .pfx
#   SIGN_TIMESTAMP_URL           - (optional) RFC3161 timestamp server URL
#                                  defaults to http://timestamp.digicert.com
#
# Trigger: push a tag like `v1.0.0`, or run manually via workflow_dispatch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tauri reads these for the Windows signing step (src-tauri/sign.cmd).
  SIGN_CERT_PATH: ${{ github.workspace }}\certificate.pfx
  SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
  SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PATH: ${{ github.workspace }}\certificate.pfx
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes($env:CERT_PATH, $bytes)

      - name: Ensure signtool is available
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $st) {
            Write-Host "Windows SDK not found - installing via Chocolatey for signtool.exe"
            choco install windows-sdk-10.1 -y --no-progress
            $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($st) {
            echo "TAURI_WINDOWS_SIGNTOOL_PATH=$($st.FullName)" | Out-File -Append $env:GITHUB_ENV
          } else {
            Write-Error "signtool.exe not found; cannot sign the build"
          }

      - name: Build and sign Tauri app
        run: npx @tauri-apps/cli build

      - name: Upload installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PharmacySuite-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
