name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: archive
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Sanity — production DB must not be tracked/modified
        shell: bash
        run: |
          git -C .. status --porcelain '*.db' '*.sqlite' || true
          echo "If any *.db shows as tracked/modified, the run is unsafe."

      - name: Run RBAC suite (H1 isolation + G4/G9 coverage)
        run: python test_rbac.py

      - name: Run security suite
        run: python test_security.py

      - name: Run Phase 16 suite
        run: python test_phase16.py

      - name: Run Phase 17 suite
        run: python test_phase17.py

      - name: Run Phase 9 final validation
        run: python test_phase9_final_validation.py

      - name: Upload temp DB artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-db-${{ matrix.os }}
          path: |
            /tmp/pharmacy_test_*.db
            ${{ runner.temp }}/pharmacy_test_*.db
          if-no-files-found: ignore
