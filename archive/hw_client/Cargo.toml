[package]
name = "hw_client"
version = "1.0.0"
edition = "2021"
description = "Native Rust hardware identification for PharmacyPro license gating"

[lib]
name = "hw_client"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
sha2 = "0.10"
hex = "0.4"
gethostname = "1.0"
mac_address = "1.0"
