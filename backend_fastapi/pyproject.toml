[project]
name = "pharmacy-fastapi"
version = "0.1.0"
description = "Stateless FastAPI backend for the Pharmacy Suite refactor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "bcrypt>=4.2,<5.0",
    "pyjwt>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.0,<25.0",
    "slowapi>=0.1.9,<1.0",
    "limits>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
