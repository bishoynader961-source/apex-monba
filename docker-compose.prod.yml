# B7 production overlay — opt-in.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Enables PostgreSQL (default DB) + Nginx TLS (nginx.tls.conf). The default
# kiosk/local compose is left untouched.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: pharmacy
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      PHARMACY_DB_URL: postgresql+asyncpg://pharmacy:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/pharmacy
    depends_on:
      db:
        condition: service_healthy

  nginx:
    volumes:
      - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pg_data:
