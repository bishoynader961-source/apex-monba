[package]
name = "pharmacy-hwid"
version = "1.0.0"
edition = "2021"
description = "Secure hardware fingerprinting and offline license token validation for PharmacyPro"
authors = ["PharmacyPro"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
hex = "0.4"
dirs = "6"
