# Pharmacy Suite — edge reverse proxy (B7)
# Routes /api/* to the FastAPI backend and everything else to the Next.js
# standalone frontend. Mirrors the existing Caddyfile routing.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # API traffic -> FastAPI backend (container "backend", port 8000).
    # Trailing slash omitted on proxy_pass so the full original URI
    # (/api/v1/...) is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check passthrough so the edge exposes backend readiness.
    location = /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js standalone frontend (container "frontend").
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
