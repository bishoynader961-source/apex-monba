# Pharmacy Suite — edge reverse proxy WITH TLS (B7 production overlay)
# Mounted by docker-compose.prod.yml. Certs expected at ./certs (cert.pem/key.pem).
# Generate a self-signed demo cert:
#   mkdir certs && openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout certs/key.pem -out certs/cert.pem -days 365 -subj "/CN=localhost"

server {
    listen 80;
    server_name _;
    # Redirect all plain HTTP to HTTPS.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # Health check passthrough.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API traffic -> FastAPI backend (container "backend", port 8000).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js standalone frontend (container "frontend", port 3000).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
