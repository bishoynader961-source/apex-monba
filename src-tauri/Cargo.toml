[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Step 2.6: standalone recovery binary. Shares fix_engine/crash_handler
# with the main app (one audited implementation) but has NO Tauri,
# NO WebView2, NO sidecars — works when the app cannot start.
[[bin]]
name = "pharmacysuite-recovery"
path = "src/bin/recovery_main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Fix-code verification (Step 2.4): audited implementations only — crypto is
# never hand-rolled. sha2+hmac reproduce the backend's HMAC-SHA256 exactly.
sha2 = "0.10"
hmac = "0.12"
# recovery:// protocol responses (Step 2.3) reuse Tauri's http types.
http = "1"
base64 = "0.22"
sqlite = "0.37"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 2

